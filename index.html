<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated 3D Card Opening</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <input type="checkbox" id="open" />
  <label for="open" class="card-box">
    <!-- Inner Card (Revealed upon opening) -->
    <div class="inner-card">
      <span class="badge">EXCLUSIVE ACCESS</span>
      <h2>You've Unlocked VIP Membership</h2>
      <p>Experience ultra-fast rewards, premium access, and handcrafted perks designed just for you.</p>
      <div class="btn">Claim Your Reward</div>
    </div>

    <div class="cover">
        <h3>Tap to Open</h3>
        <p class="hint">Click or hover to reveal inside</p>
    </div>
  </label>
</body>
</html>
